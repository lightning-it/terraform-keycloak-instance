# Managed by lightning-it/shared-assets-lit.
# Keep this repository-local workflow aligned with the protected release policy.
# yamllint disable rule:truthy
---
name: Sync main back to develop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  backmerge:
    if: github.repository_owner == 'lightning-it'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Mint release automation App token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Validate release bot token
        id: release-bot
        env:
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "${APP_SLUG}" = "lightning-it-release-automation"
          installations="$(
            gh api --paginate --slurp \
              "installation/repositories?per_page=100"
          )"
          jq -e --arg repository "${REPOSITORY}" \
            'any(.[].repositories[]?; .full_name == $repository)' \
            <<<"${installations}" >/dev/null
          login="$(gh api "users/lightning-it-release-automation%5Bbot%5D" --jq .login)"
          bot_id="$(gh api "users/lightning-it-release-automation%5Bbot%5D" --jq .id)"
          if [ "${login}" != "lightning-it-release-automation[bot]" ] || ! [[ "${bot_id}" =~ ^[0-9]+$ ]]; then
            echo "::error::Release App identity mismatch: expected lightning-it-release-automation[bot]."
            exit 1
          fi
          echo "email=${bot_id}+${login}@users.noreply.github.com" >>"${GITHUB_OUTPUT}"

      - name: Create file-identical ancestry backmerge
        env:
          BOT_EMAIL: ${{ steps.release-bot.outputs.email }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          token_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${token_header}"

          git init --quiet repository
          cd repository
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${token_header}" \
            fetch --quiet --no-tags origin main develop
          main_short="$(git rev-parse --short=12 origin/main)"
          develop_short="$(git rev-parse --short=12 origin/develop)"
          branch="backmerge/shared-assets-${main_short}-${develop_short}-main"
          title="chore(governance): record main ancestry before ${main_short}"
          git config user.name lightning-it-release-automation[bot]
          git config user.email "${BOT_EMAIL}"
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo 'develop already contains the current main ancestry.'
            exit 0
          fi

          git switch --create "${branch}" origin/develop
          # Bind the merge object to an existing Git timestamp so a retry after
          # the branch push (but before PR creation) recreates the exact SHA.
          merge_date="$(git show -s --format=%cI origin/main)"
          GIT_AUTHOR_DATE="${merge_date}" GIT_COMMITTER_DATE="${merge_date}" \
            git merge --no-ff --strategy=ours origin/main \
            --message 'merge: preserve develop tree and main ancestry'
          git merge-base --is-ancestor origin/main HEAD
          git merge-base --is-ancestor origin/develop HEAD
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]
          git diff --quiet origin/develop HEAD
          remote_head="$(
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${token_header}" \
              ls-remote --heads origin "refs/heads/${branch}" | awk '{print $1}'
          )"
          if [ -n "${remote_head}" ]; then
            local_head="$(git rev-parse HEAD)"
            if [ "${remote_head}" != "${local_head}" ]; then
              echo "::error::Backmerge branch collision; refusing to overwrite existing history."
              exit 1
            fi
            echo 'Exact backmerge branch already exists; no push required.'
          else
            # A normal first push is race-safe: it cannot overwrite non-fast-forward
            # history if another actor creates or updates the branch after ls-remote.
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${token_header}" \
              push \
              origin \
              "HEAD:refs/heads/${branch}"
          fi

          pr_number="$(
            gh api --method GET "repos/${REPOSITORY}/pulls" \
              -f state=open \
              -f base=develop \
              -f "head=lightning-it:${branch}" \
              --jq '.[0].number // empty'
          )"
          if [ -z "${pr_number}" ]; then
            pr_url="$(
              gh pr create \
                --repo "${REPOSITORY}" \
                --base develop \
                --head "${branch}" \
                --title "${title}" \
                --body 'Automated develop-tree-preserving ancestry backmerge after a protected main promotion.'
            )"
            pr_number="${pr_url##*/}"
          fi

          gh pr view "${pr_number}" \
            --repo "${REPOSITORY}" \
            --json author,baseRefName,headRefName,headRepositoryOwner,title \
          | jq -e \
              --arg branch "${branch}" \
              --arg title "${title}" \
              '.author.login == "app/lightning-it-release-automation"
               and .baseRefName == "develop"
               and .headRefName == $branch
               and .headRepositoryOwner.login == "lightning-it"
               and .title == $title' \
            | grep -qx true
          pr_id="$(gh pr view "${pr_number}" --repo "${REPOSITORY}" --json id --jq .id)"
          auto_merge_enabled="$(
            gh pr view "${pr_number}" --repo "${REPOSITORY}" \
              --json autoMergeRequest --jq '.autoMergeRequest != null'
          )"
          case "${auto_merge_enabled}" in
            true) ;;
            false)
              query="mutation(\$pr:ID!){enablePullRequestAutoMerge("
              query+="input:{pullRequestId:\$pr,mergeMethod:MERGE}){"
              query+="pullRequest{autoMergeRequest{enabledAt}}}}"
              gh api graphql \
                -f query="${query}" \
                -f pr="${pr_id}" \
                --jq '.data.enablePullRequestAutoMerge.pullRequest.autoMergeRequest != null' \
                | grep -qx true
              ;;
            *) echo "::error::Unable to determine auto-merge state."; exit 1 ;;
          esac
